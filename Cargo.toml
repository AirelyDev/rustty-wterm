[package]
name = "rustty-wterm"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT"
publish = false
description = "wterm's ghostty-vt wasm ABI, implemented on the Rustty VT engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Path dependency on the Rustty workspace (read-only). Only render state is on;
# everything else is off to keep the wasm small.
#
# `kitty-graphics` is deliberately OFF (Task 5 decision gate, outcome B):
# rustty-vt forces `options::KITTY_GRAPHICS = false` on freestanding targets,
# wasm32-unknown-unknown included (no timestamps, no wuffs PNG/zlib there), so
# the shipped wasm ignores every `ESC _ G` command whatever the feature says.
# Leaving it off on the host too keeps `cargo test` describing the same engine.
rustty-vt = { path = "../rustty/crates/rustty-vt", default-features = false, features = ["render-state"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# rustty-vt's debug builds run Page::verify_integrity on every page grow/resize
# (`cfg!(debug_assertions)`), which makes the hostile-input tests (a 65535x65535
# resize, 4 MB of garbage) take many minutes. The engine's debug assertions are
# the engine's own business (Rustty tests them); this crate's tests exercise the
# adapter against the same code as release, so build the engine as release does.
[profile.dev.package.rustty-vt]
debug-assertions = false
opt-level = 2
